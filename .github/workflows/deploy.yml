name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Upload Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files via SFTP
        uses: pressidium/sftp-deploy-action@v1.1.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: 22
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_dir: ./
          remote_dir: egzsession/public_html/
          # Исключаем служебные папки Git и GitHub, чтобы они не попали на сервер
          args: -R --exclude-glob .git* --exclude-glob .github*
